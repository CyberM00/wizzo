<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Mini Kneeboard</title>
  {# A plane in the tab, inline so there is no second request and nothing to 404.
     Amber on transparent: it reads on a light tab strip and a dark one alike.
     Kept in step with --amber in the stylesheet. #}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23ffb454' d='M30 17.2c0 .9-.7 1.6-1.6 1.6h-8.1l-4.4 10.4c-.1.3-.4.5-.7.5h-2.4c-.5 0-.9-.5-.7-1l2.6-9.9H9l-2 3c-.2.2-.4.4-.7.4H4.6c-.5 0-.9-.5-.7-1l1.4-4.1-1.4-4.1c-.2-.5.2-1 .7-1h1.7c.3 0 .5.1.7.4l2 3h5.7l-2.6-9.9c-.2-.5.2-1 .7-1h2.4c.3 0 .6.2.7.5l4.4 10.4h8.1c.9 0 1.6.7 1.6 1.6z'/%3E%3C/svg%3E">
  <script>
    // Applied before the stylesheet paints, otherwise a night-theme board
    // flashes white on every load on a phone.
    try {
      var t = localStorage.getItem("kb.theme");
      if (t === "day" || t === "night") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/kneeboard.css') }}">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <h1>Kneeboard</h1>
        <div class="sub" id="brand-sub">starting&hellip;</div>
      </div>
      <nav id="nav"></nav>
      <div class="side-controls">
        <button id="sim-btn" type="button">&mdash;</button>
        <button id="theme-btn" type="button" title="Switch between the night and day palette (T)">Day</button>
      </div>
      <div class="sidebar-foot">
        <div id="freshness">&mdash;</div>
        <div id="generated"></div>
      </div>
    </aside>
    <main id="main">
      <div class="empty">Loading briefing&hellip;</div>
    </main>
  </div>
  <script>window.KNEEBOARD_VERSION = "{{ version }}";</script>
  <script src="{{ url_for('static', filename='js/kneeboard.js') }}"></script>
</body>
</html>
